name: Mobile app

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile-app.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Expo SDK compatibility
        run: npx expo-doctor
      - name: JavaScript bundle builds
        run: npx expo export --platform android --output-dir /tmp/export

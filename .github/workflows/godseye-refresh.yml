name: Refresh God's-eye data

# Every 12 hours: re-read live weather, air quality (Open-Meteo, no key), NASA FIRMS fire
# hotspots (secret NASA_FIRMS_MAP_KEY) and Mandi prices (data.gov.in, secret
# DATA_GOV_IN_API_KEY) into places/godseye.json, so the page
# never calls a third-party API per visit. A source that fails keeps its last good values;
# a missing key leaves that layer marked "not on yet".
on:
  schedule:
    - cron: '40 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: godseye-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild live readings
        env:
          NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: timeout 15m python3 tools/build-godseye.py

      - name: Check the file
        run: python3 -c "import json; d = json.load(open('places/godseye.json')); assert len(d['districts']) == 23"

      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "place-data-bot"
          git config user.email "place-data-bot@users.noreply.github.com"
          git add places/godseye.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh God's-eye readings $(date -u +%F-%H%M)"
            git push origin HEAD:main
            gh workflow run github-pages.yml --ref main
          else
            echo "no new readings"
          fi

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install collector dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare deployment
        run: |
          mkdir -p deploy
          # Internal notes, tools and server-side code stay in the repository, not on the site.
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude 'supabase' \
            --exclude 'api' --exclude 'server' --exclude '.env*' --exclude '.dev.vars*' --exclude 'package*.json' --exclude 'tests' --exclude 'tools' --exclude 'deploy' --exclude 'mobile' --exclude 'desktop' --exclude '*.md' --exclude 'og-card.html' \
            --exclude '.gitignore' --exclude 'vercel.json' --exclude 'wrangler.jsonc' --exclude '.assetsignore' --exclude 'worker.js' --exclude 'WEST BENGAL*.geojson' ./ deploy/

      - name: Collect sanitised Delhi bus snapshot
        env:
          DELHI_OTD_API_KEY: ${{ secrets.DELHI_OTD_API_KEY }}
        run: node tools/transit/publish-snapshot.mjs deploy/places/transit/delhi.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

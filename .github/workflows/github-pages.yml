name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/tender-hopper-r3zed1]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd kasa-app && npm ci

      - name: Build React app
        run: cd kasa-app && npm run build

      - name: Prepare deployment
        run: |
          mkdir -p deploy
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude 'kasa-app' \
            --exclude 'namma-kasa-web' --exclude 'supabase' --exclude 'tests' --exclude 'deploy' ./ deploy/
          mkdir -p deploy/app
          cp -r kasa-app/dist/* deploy/app/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

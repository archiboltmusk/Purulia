name: Set up transit passenger backend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transit-backend
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client library
        run: pip install 'psycopg[binary]==3.2.*'
      - name: Apply and verify only the transit passenger migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 tools/transit/apply-backend.py

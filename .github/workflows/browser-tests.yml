name: Browser smoke tests

# Loads kasa.html in headless Chromium (desktop + phone size) with Supabase, map tiles and
# CDN scripts stubbed: page load, map with reports, controls not overlapping, report form,
# confirm flow. See tests/browser/.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Main only: PRs skip browser smoke (owner's choice, keeps PR waits short).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          retention-days: 7

name: Internet Speed Atlas
on:
  pull_request:
    paths: ['internet-speed*', 'tests/internet-speed*', 'tests/browser/internet-speed*', 'supabase/**', '.github/workflows/internet-speed-tests.yml']
  push:
    branches: [main]
    paths: ['internet-speed*', 'tests/internet-speed*', 'tests/browser/internet-speed*', 'supabase/**', '.github/workflows/internet-speed-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: node --check internet-speed.js && node --check internet-speed-core.mjs && node --test tests/internet-speed.test.mjs
      - run: npm ci
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npx playwright test internet-speed.spec.mjs
        working-directory: tests/browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: atlas-browser-results
          path: tests/browser/test-results/

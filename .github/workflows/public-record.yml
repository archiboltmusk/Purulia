name: Daily public record

on:
  schedule:
    - cron: '43 0 * * *'   # 06:13 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fingerprint today's public data
        run: node tools/public-record.mjs

      - name: Commit
        run: |
          git config user.name "kasa-record-bot"
          git config user.email "kasa-record-bot@users.noreply.github.com"
          git add record
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Public record $(date -u +%F)"
          git push origin HEAD:main

      - name: Ask the Internet Archive to save today's entry
        continue-on-error: true
        run: |
          d=$(date -u +%F)
          for f in "record/${d:0:4}/$d.txt" record/MANIFEST.txt; do
            curl -sS -o /dev/null -w "%{http_code} $f\n" --max-time 60 \
              "https://web.archive.org/save/https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/$f" || true
          done

name: Deploy Purulia Kasa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate config.js
        run: |
          echo "window.KASA_CONFIG = {" > config.js
          echo "  SUPABASE_URL: '${{ vars.SUPABASE_URL }}'," >> config.js
          echo "  SUPABASE_ANON_KEY: '${{ vars.SUPABASE_ANON_KEY }}'" >> config.js
          echo "};" >> config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4

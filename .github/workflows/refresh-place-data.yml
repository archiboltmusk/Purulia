name: Refresh place data

# Monthly: re-read every district's sourced facts (Wikidata/Census 2011, Wikipedia,
# NFHS-5, Jal Jeevan Mission) into places/wb_district_facts.json and publish it.
# Only that data file is committed; the builder's checks stop a bad download, and a
# source that fails keeps its last good values.
on:
  schedule:
    - cron: '17 1 3 * *'   # 3rd of each month, 06:47 IST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-place-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rebuild district facts
        run: python3 tools/build-wb-district-facts.py

      - name: Check the file
        run: python3 -c "import json; d = json.load(open('places/wb_district_facts.json')); assert len(d['districts']) == 23; assert d['nfhs']['districts']"

      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "place-data-bot"
          git config user.email "place-data-bot@users.noreply.github.com"
          git add places/wb_district_facts.json
          # Only the date moved: nothing to publish.
          if git diff --cached -U0 | grep '^[+-] ' | grep -vq '"generated"\|"read"'; then
            git commit -m "Refresh district facts $(date -u +%F)"
            git push origin HEAD:main
            # A push made with the workflow token does not start other workflows, so ask Pages to deploy.
            gh workflow run github-pages.yml --ref main
          else
            echo "no new figures"
          fi

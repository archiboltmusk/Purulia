name: Refresh place data

# Monthly: re-read every district's sourced facts (Wikidata/Census 2011, Wikipedia,
# NFHS-5, Jal Jeevan Mission) into places/wb_district_facts.json, plus district
# officials (Who's Who pages), town councillors (SEC results portal), ministers and
# MPLADS, MLA/MP affidavits (ADR/MyNeta), and publish them. Only data files are committed; a source that fails keeps
# its last good values, and tools/keep-if-changed.py drops files where only the date
# moved or that shrank.
on:
  schedule:
    - cron: '17 1 3 * *'   # 3rd of each month, 06:47 IST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-place-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild district facts
        run: python3 tools/build-wb-district-facts.py

      - name: Check the file
        run: python3 -c "import json; d = json.load(open('places/wb_district_facts.json')); assert len(d['districts']) == 23; assert d['nfhs']['districts']"

      # Each source is optional: a site that is down this month must not stop the rest.
      - name: Rebuild district officials
        continue-on-error: true
        run: timeout 20m python3 tools/build-wb-officials.py

      - name: Rebuild town councillors
        continue-on-error: true
        run: timeout 30m python3 tools/build-wb-councillors.py

      - name: Rebuild ministers and MPLADS
        continue-on-error: true
        run: timeout 30m python3 tools/build-wb-reps.py || git checkout -- places/wb_ministers.json places/wb_mplads.json places/mplads

      - name: Rebuild MLA and MP affidavits
        continue-on-error: true
        run: timeout 20m python3 tools/build-wb-affidavits.py || git checkout -- places/wb_affidavits.json

      - name: Keep only real changes
        run: python3 tools/keep-if-changed.py $(git diff --name-only -- places)

      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "place-data-bot"
          git config user.email "place-data-bot@users.noreply.github.com"
          git add places/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh place data $(date -u +%F)"
            git push origin HEAD:main
            # A push made with the workflow token does not start other workflows, so ask Pages to deploy.
            gh workflow run github-pages.yml --ref main
          else
            echo "no new figures"
          fi

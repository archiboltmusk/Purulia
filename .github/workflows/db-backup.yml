name: Weekly database backup

# The free Supabase plan keeps no backups. Once a week this dumps the site's own
# data (public + kasa_private, and the sign-in accounts from auth), encrypts it
# with a passphrase, and keeps it as a workflow artifact for 90 days. Report photos
# (public kasa-photos bucket) are listed from the database, downloaded from their public
# URLs and kept the same way, encrypted, as a second artifact.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     the Session pooler connection string from Supabase →
#                       Connect (postgresql://postgres.<ref>:<password>@aws-…pooler.supabase.com:5432/postgres).
#                       The "Direct connection" one is IPv6-only and GitHub runners can't reach it.
#   BACKUP_PASSPHRASE   any long passphrase. Keep a copy somewhere safe; without it the backup can't be opened.
# Without them the job says so and stops, green.
#
# Restore: download the artifact, then
#   gpg --batch --passphrase '<passphrase>' -d purulia-db-<date>.sql.gz.gpg | gunzip > backup.sql
#   psql "<target connection string>" -f backup.sql
#   gpg --batch --passphrase '<passphrase>' -d purulia-photos-<date>.tar.gpg | tar -x -C photos/
on:
  schedule:
    - cron: '20 22 * * 0'   # Monday 03:50 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        id: cfg
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::warning::SUPABASE_DB_URL or BACKUP_PASSPHRASE is not set, so no backup was taken."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pg_dump 17
        if: steps.cfg.outputs.ok == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - uses: actions/checkout@v7
        if: steps.cfg.outputs.ok == 'true'
        with:
          sparse-checkout: config.js
          sparse-checkout-cone-mode: false

      - name: Dump and encrypt
        if: steps.cfg.outputs.ok == 'true'
        run: |
          set -euo pipefail
          PGD=/usr/lib/postgresql/17/bin/pg_dump
          OUT="purulia-db-$(date -u +%Y-%m-%d).sql.gz.gpg"
          {
            "$PGD" "$DB_URL" --no-owner --no-privileges -n public -n kasa_private
            "$PGD" "$DB_URL" --no-owner --no-privileges --data-only -t auth.users -t auth.identities
          } | gzip -9 | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASSPHRASE" -o "$OUT"
          ls -lh "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}
          retention-days: 90
          compression-level: 0

      - name: Download and encrypt photos
        if: steps.cfg.outputs.ok == 'true'
        run: |
          set -euo pipefail
          BASE=$(grep -oE "https://[a-z0-9]+\.supabase\.co" config.js | head -1)
          mkdir -p photos
          /usr/lib/postgresql/17/bin/psql "$DB_URL" -Atc "select name from storage.objects where bucket_id = 'kasa-photos' order by name" > photos.txt
          fail=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            mkdir -p "photos/$(dirname "$name")"
            curl -fsS --retry 3 -o "photos/$name" "$BASE/storage/v1/object/public/kasa-photos/$name" || { echo "::warning::could not download $name"; fail=$((fail+1)); }
          done < photos.txt
          echo "$(wc -l < photos.txt) photos listed, $fail failed"
          PHOTOS="purulia-photos-$(date -u +%Y-%m-%d).tar.gpg"
          tar -C photos -cf - . | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASSPHRASE" -o "$PHOTOS"
          ls -lh "$PHOTOS"
          echo "PHOTOS=$PHOTOS" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          name: ${{ env.PHOTOS }}
          path: ${{ env.PHOTOS }}
          retention-days: 90
          compression-level: 0

name: Kasa tests

on:
  push:
    branches: [main]
    paths: ['supabase/**', 'kasa*.js', 'map-layers.js', 'money-metrics.js', 'hostel.js', 'boundary-live.js', 'theme-init.js', 'places.js', 'add-town.js', 'sw.js', 'admin.js', 'dogs.js', 'works.js', 'partner.js', 'partner.html', 'routes.js', 'money.js', 'case.js', 'mitu.js', 'stories.js', 'calendar.js', 'compare.js', 'record.js', 'admin-evidence.js', 'snakes.js', 'pandals.js', 'promises.js', 'noticeboard.js', 'bug-report.js', 'source-fix.js', 'translate-fix.js', 'assistant.js', 'page-lang.js', 'place-facts.js', 'data-place.js', 'home-place.js', 'circle-place.js', 'municipality-place.js', 'godseye.js', 'air.js', 'air.html', 'tools/build-openaq.py', 'tests/test_build_openaq.py', 'mp.js', 'mp.html', 'offices.js', 'offices.html', 'tools/build-mp-profiles.py', 'solutions.js', 'solutions.html', 'rti.js', 'rti.html', 'tests/rti.test.mjs', 'rti-letter.js', 'rti-letter.html', 'rti-letter-i18n.js', 'tests/rti-letter.test.mjs', 'changelog.html', 'version.js', 'tools/version.mjs', '.github/workflows/kasa-tests.yml']
  pull_request:
    paths: ['supabase/**', 'kasa*.js', 'map-layers.js', 'money-metrics.js', 'hostel.js', 'boundary-live.js', 'theme-init.js', 'places.js', 'add-town.js', 'sw.js', 'admin.js', 'dogs.js', 'works.js', 'partner.js', 'partner.html', 'routes.js', 'money.js', 'case.js', 'mitu.js', 'stories.js', 'calendar.js', 'compare.js', 'record.js', 'admin-evidence.js', 'snakes.js', 'pandals.js', 'promises.js', 'noticeboard.js', 'bug-report.js', 'source-fix.js', 'translate-fix.js', 'assistant.js', 'page-lang.js', 'place-facts.js', 'data-place.js', 'home-place.js', 'circle-place.js', 'municipality-place.js', 'godseye.js', 'air.js', 'air.html', 'tools/build-openaq.py', 'tests/test_build_openaq.py', 'mp.js', 'mp.html', 'offices.js', 'offices.html', 'tools/build-mp-profiles.py', 'solutions.js', 'solutions.html', 'rti.js', 'rti.html', 'tests/rti.test.mjs', 'changelog.html', 'version.js', 'tools/version.mjs', '.github/workflows/kasa-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-rules:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install "psycopg[binary]==3.2.*"
      - name: Migration + loophole scenarios (production replica and fresh project)
        env:
          PGHOST: localhost
          PGPORT: '5432'
        run: bash supabase/tests/run.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Syntax check
        run: for f in partner.js theme-init.js kasa.js map-layers.js money-metrics.js boundary-live.js kasa-i18n.js solutions.js rti.js rti-letter.js rti-letter-i18n.js digest-sheet.js kasa-photo-meta.js admin.js sw.js config.js schools.js adopt.js dogs.js works.js snakes.js pandals.js hostel.js waste.js toilets.js promises.js noticeboard.js bug-report.js source-fix.js translate-fix.js assistant.js page-lang.js version.js places.js add-town.js districts.js place-facts.js data-place.js home-place.js circle-place.js municipality-place.js godseye.js air.js analytics.js digest.js routes.js money.js case.js stories.js calendar.js compare.js record.js admin-evidence.js mp.js offices.js; do node --check "$f"; done
      - name: RTI due dates and appeal windows
        run: node tests/rti.test.mjs
      - name: RTI letter builder
        run: node tests/rti-letter.test.mjs
      - name: OpenAQ builder (offline)
        run: python3 tests/test_build_openaq.py
      - name: Version matches the changelog
        run: node tools/version.mjs --check
      - name: Photo metadata reader (three time zones)
        run: for tz in UTC Asia/Kolkata America/New_York; do TZ=$tz node tests/kasa_photo_meta.test.mjs; done
      - name: Photo fingerprint + Vision scoring
        run: |
          npm install --no-save imagescript@1.3.0 jpeg-js@0.4.4
          node --experimental-strip-types supabase/tests/photo_fingerprint.test.mts
      - name: Ward boundaries
        run: node tools/validate-wards.mjs purulia_wards.geojson || echo "::warning::Ward boundary file has problems (see log)"

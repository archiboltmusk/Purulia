<!DOCTYPE html>
<html lang="en">
<head>
<script src="theme-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP profile — Parishkar</title>
<meta name="description" content="A Lok Sabha MP's sourced record: constituency, local area fund, Parliament work, sworn affidavit. Each figure has its source.">
<meta name="theme-color" content="#0a0805">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23DD3333' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23DD3333'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{--red:#C62828;--ink:#1d1a17;--mute:#6b645c;--line:#e4ddd3;--panel:#f6f2ec;--ok:#2e7d32;}
  :root[data-theme="dark"]{--ink:#f0e6d0;--mute:#b3a898;--line:#3a332b;--panel:#1b1714;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#f0e6d0;--mute:#b3a898;--line:#3a332b;--panel:#1b1714;}}
  body{margin:0;background:#fff;color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{background:#0a0805;}}
  :root[data-theme="dark"] body{background:#0a0805;}
  .mp{max-width:620px;margin:0 auto;padding:1.4rem 16px 4rem;}
  .mp-back{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);text-decoration:none;}
  .mp-head{display:flex;gap:1rem;align-items:center;padding:1rem 0 1.2rem;border-bottom:1px solid var(--line);}
  .mp-av{flex:0 0 72px;height:72px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-family:"Plus Jakarta Sans",serif;font-size:26px;color:var(--mute);}
  .mp-name{font-family:"Plus Jakarta Sans",serif;font-size:clamp(1.5rem,5vw,1.9rem);font-weight:700;line-height:1.1;margin:0;}
  .mp-sub{margin-top:.35rem;color:var(--mute);font-size:.95rem;}
  .mp-h{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:1.8rem 0 .7rem;}
  .mp-chips{display:flex;flex-wrap:wrap;gap:.45rem;}
  .mp-chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:.4rem .75rem;font-size:.88rem;}
  .mp-links{display:flex;flex-wrap:wrap;gap:1rem;margin-top:.9rem;font-size:.92rem;}
  .mp-links a,.mp-src a,.mp-more{color:var(--red);text-decoration:none;}
  .mp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;background:var(--panel);border-radius:6px;padding:1rem .5rem;text-align:center;}
  .mp-stat b{display:block;font-family:"Plus Jakarta Sans",serif;font-size:1.9rem;color:var(--red);line-height:1;}
  .mp-stat span{display:block;margin-top:.4rem;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);}
  .mp-box{background:var(--panel);border-radius:6px;padding:1rem;}
  .mp-row{display:flex;justify-content:space-between;gap:1rem;padding:.6rem 0;border-bottom:1px solid var(--line);font-size:.92rem;}
  .mp-row:last-child{border-bottom:0;}
  .mp-row small{display:block;color:var(--mute);font-family:"JetBrains Mono",monospace;font-size:11px;margin-top:.15rem;}
  .mp-val{font-family:"Plus Jakarta Sans",serif;font-size:1.25rem;font-weight:700;text-align:right;white-space:nowrap;}
  .mp-trio{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;text-align:center;}
  .mp-trio b{display:block;font-family:"Plus Jakarta Sans",serif;font-size:1.35rem;}
  .mp-trio span{display:block;margin-top:.3rem;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);}
  .mp-list li{list-style:none;padding:.6rem 0;border-bottom:1px solid var(--line);font-size:.92rem;}
  .mp-list{padding:0;margin:0;}
  .mp-list small{display:block;color:var(--mute);font-family:"JetBrains Mono",monospace;font-size:11px;margin-top:.2rem;}
  .mp-text{font-size:.9rem;color:var(--mute);line-height:1.6;margin:.7rem 0 0;}
  .mp-nr{color:var(--mute);font-style:italic;font-size:.92rem;}
  .mp-src{margin-top:.6rem;font-size:.82rem;color:var(--mute);}
  .mp-more{background:none;border:0;padding:.6rem 0 0;font:inherit;cursor:pointer;}
  .mp-err{padding:2rem 0;color:var(--mute);}
  [hidden]{display:none!important;}
</style>
<script src="bug-report.js"></script>
</head>
<body>
<main class="mp" id="mp">
  <a class="mp-back" href="kasa.html">← Map</a>
  <p class="mp-err" id="mp-msg">Loading…</p>
  <div id="mp-body" hidden></div>
</main>
<script src="mp.js"></script>
</body>
</html>
